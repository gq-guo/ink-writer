[package]
name = "ink-writer"
version = "0.3.0"
description = "Ink — 极简 Markdown 写作软件"
authors = ["Ink"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[lib]
name = "ink_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
notify-debouncer-mini = "0.5"
chardetng = "0.1"
encoding_rs = "0.8"
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
